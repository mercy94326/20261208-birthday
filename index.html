<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我們的雲林小旅行</title>
<style>
:root{color-scheme:light;--bg:#fbf1dc;--card:#fffaf0;--brown:#7a5638;--gold:#c9a063;--purple:#7466a8;--green:#8fa56a;--ink:#4a3a2c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#efe3cc;color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{max-width:430px;height:100%;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;padding:18px 18px 110px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.cover{background:linear-gradient(180deg,#6f93bf 0%,#e8b48e 45%,#f08a4b 68%,#3b4a3a 69%,#2c3a2c 100%);color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px}
.cover h1{font-size:34px;line-height:1.4;margin:0;text-shadow:0 2px 8px #0005;transform:rotate(-6deg)}
.cover p{margin:0;opacity:.9;letter-spacing:2px}
.btn{border:0;border-radius:22px;padding:13px 24px;font-size:16px;font-weight:600;color:#fff;background:var(--gold);width:100%;cursor:pointer}
.btn.w{background:#fff;color:var(--brown);width:auto;padding:13px 34px}
.btn.p{background:var(--purple)}
.btn:disabled{opacity:.45}
h2{margin:6px 0 4px;font-size:21px;text-align:center}
.badge{display:block;margin:0 auto;width:max-content;background:var(--brown);color:#fff;border-radius:20px;padding:4px 18px;font-size:14px}
.tag{background:#f4e0b8;border-radius:16px;padding:8px 14px;text-align:center;font-weight:600;margin:12px 0}
.back{background:none;border:0;font-size:24px;color:var(--brown);padding:0;cursor:pointer}
.stop{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #7a563822;cursor:pointer}
.stop .ic{font-size:30px;width:50px;height:50px;border-radius:50%;background:#f4e0b8;display:grid;place-items:center;flex:none}
.stop b{display:block}.stop small{color:#8b7a68}
.st{margin-left:auto;font-size:12px;border-radius:10px;padding:3px 9px;background:#e6dcc8;color:#8b7a68;white-space:nowrap}
.st.ok{background:#cfe3b8;color:#47632a}.st.go{background:var(--gold);color:#fff}
.lock{opacity:.6}
.opt{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid #ecd9b4;border-radius:16px;padding:13px 14px;margin:9px 0;cursor:pointer;font-size:16px}
.opt.sel{border-color:var(--gold);background:#fff2d6}.opt.bad{border-color:#d98a8a;background:#fbe5e5;animation:sh .3s}
.opt i{width:18px;height:18px;border:2px solid #cbb48a;border-radius:50%;flex:none}.opt.sel i{background:var(--gold)}
.opt span{margin-left:auto;font-size:24px}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.polaroid{background:#fff;padding:10px 10px 34px;border-radius:6px;box-shadow:0 6px 16px #0003;transform:rotate(2deg);margin:16px auto;width:86%;text-align:center;color:#777}
.polaroid img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#dde6ee;display:block}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gift{background:var(--card);border-radius:14px;padding:12px 4px;text-align:center;font-size:13px;border:2px solid transparent}
.gift div{font-size:32px}.gift.got{border-color:var(--gold);background:#fff2d6}
.fab{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;border:3px solid #fff;background:var(--purple);color:#fff;font-size:12px;box-shadow:0 4px 14px #0004;z-index:5;cursor:pointer;line-height:1.2}
.fab b{display:block;font-size:24px}
.fab em{position:absolute;top:-6px;right:-4px;background:#e0675a;border-radius:10px;min-width:22px;font-style:normal;padding:2px 5px;font-size:12px}
.note{font-size:13px;color:#8b7a68;text-align:center;margin:8px 0}
video,canvas{width:100%;border-radius:14px;background:#000}
.bar{height:8px;border-radius:4px;background:#e6dcc8;overflow:hidden;margin:10px 0}.bar div{height:100%;background:var(--purple);width:0}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:#000b;color:#fff;border-radius:16px;padding:8px 16px;font-size:14px;z-index:9;white-space:nowrap}
.ov{position:absolute;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));animation:in .3s}
.env{text-align:center;color:#fff;cursor:pointer;font-size:18px}.env .em{font-size:96px;animation:bob 1.2s infinite alternate}
@keyframes bob{to{transform:translateY(-14px) rotate(4deg)}}
.letter{background:#fffaf0;border-radius:18px;padding:20px;width:100%;max-height:100%;min-height:0;display:flex;flex-direction:column;gap:12px;position:relative}
.lt{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;line-height:1.8;font-size:15px}.lt p{margin:0 0 12px}
.letter .btn{flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 4px;margin:14px 0 8px}
.box{grid-column:span 2;position:relative;cursor:pointer;animation:flt 2.4s ease-in-out infinite alternate;transition:opacity .3s}
.box:nth-child(4){grid-column:2/4}.box:nth-child(5){grid-column:4/6}
.box svg{width:100%;display:block;filter:drop-shadow(0 6px 6px #7a563833)}
.box .lid{transform-origin:20px 32px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.box.open{animation:none}.box.open .lid{transform:translate(10px,-22px) rotate(20deg)}
.box.shake{animation:shk .12s linear infinite}
.box.dim{opacity:.3;pointer-events:none;animation:none}
.box .gi{position:absolute;left:0;right:0;top:-4px;text-align:center;font-size:38px;pointer-events:none}
.box.open .gi{animation:rise .6s .15s both}
@keyframes flt{to{transform:translateY(-7px)}}
@keyframes shk{25%{transform:rotate(-9deg) scale(1.1)}75%{transform:rotate(9deg) scale(1.1)}}
@keyframes rise{from{transform:translateY(34px) scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pp{from{transform:scale(.3);opacity:0}}
.pz{flex-direction:column;overflow:hidden}
.rays{position:absolute;width:640px;height:640px;left:50%;top:50%;margin:-320px 0 0 -320px;background:repeating-conic-gradient(#ffe9a855 0 9deg,#ffe9a800 9deg 18deg);border-radius:50%;animation:spin 16s linear infinite;-webkit-mask:radial-gradient(circle,#000 15%,transparent 68%);mask:radial-gradient(circle,#000 15%,transparent 68%)}
.pc{position:relative;background:#fffaf0;border-radius:26px;padding:24px 26px 22px;text-align:center;width:78%;animation:pp .6s cubic-bezier(.2,1.6,.4,1);box-shadow:0 10px 40px #0006}
.pc small{color:#a8855d;font-size:14px}.pc h3{margin:4px 0 16px;font-size:24px;color:var(--brown)}
.pi{font-size:96px;line-height:1.3;filter:drop-shadow(0 0 16px #ffd66b);animation:bob 1.1s infinite alternate}
.fx{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.fx i{position:absolute;left:50%;top:40%;width:8px;height:14px;border-radius:2px;animation:bst 1.5s ease-out forwards}
@keyframes bst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.pzl{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;aspect-ratio:4/3;margin:12px 0;border-radius:12px;overflow:hidden}
.pp{background-image:var(--img);background-size:500% 400%;cursor:pointer;border-radius:3px;transition:transform .15s}
.pp.on{outline:3px solid var(--gold);outline-offset:-3px;transform:scale(.93);z-index:1}
.pzl.done{gap:0}.pzl.done .pp{border-radius:0;pointer-events:none}
.pzw{position:relative}.ref{position:absolute;inset:12px 0;background:var(--img) center/cover;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}.pzw.peek .ref{opacity:1}
.cv{width:100%;aspect-ratio:4/5;background:#fff;border-radius:14px;box-shadow:0 3px 12px #7a563833;touch-action:none;display:block;margin:10px 0}
.tools{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px #0003;cursor:pointer}.sw.on{outline:3px solid var(--gold)}
.tb{border:2px solid #ecd9b4;background:var(--card);border-radius:14px;padding:8px 12px;font-size:14px;color:var(--ink);cursor:pointer}.tb.on{background:#fff2d6;border-color:var(--gold)}
</style>

</head>
<body>
<div id="app"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="up" accept="image/*" hidden>
<script>
// ====== 可自行修改的設定 ======
// ans = 正確答案的索引(0=A,1=B,2=C,3=D)；null = 任何答案都算對（適合「對方最喜歡的食物」這類個人題）
const STATIONS=[
 {n:1,icon:"🚉",name:"雲林火車站 / 租車",sub:"冒險的起點！",time:""},
 {n:2,icon:"🍞",name:"樂米工坊",sub:"默契大考驗 · 7 題",time:"",qs:[
  {q:"我們第一次約會的地方？",ans:1,opts:["電影院","你家","夜市","咖啡廳"]},
  {q:"在飲料中我最喜歡加什麼料？",ans:2,opts:["椰果","仙草","珍珠","布丁"]},
  {q:"在一起到現在，我最印象深刻的是哪一次約會？",ans:0,opts:["聖誕節","情人節","生日","跨年"]},
  {q:"我什麼時候最常想起你？",ans:3,opts:["吃到好吃的","聽到某首歌","經過約會地點","看到情侶短片"]},
  {q:"當我心情不好時我最希望你？",ans:1,opts:["給我空間","靜靜的抱著我","陪我說話","帶我去吃好吃的"]},
  {q:"如果突然多一天假期，我會選擇？",ans:2,opts:["出去旅行","看電影","在家裡","逛街"]},
  {q:"我最喜歡的節日？",ans:1,opts:["情人節","聖誕節","跨年","七夕"]}]},
 {n:3,icon:"🌅",name:"雲林成龍濕地",sub:"夕陽拼圖挑戰 🧩",time:"17:00 看夕陽",puzzle:true},
 {n:4,icon:"☕",name:"白水咖啡",sub:"一起畫畫 · 在瑞士的我們 🎨",time:"19:00 前抵達",draw:true},
 {n:5,icon:"🏡",name:"西螺後街童話民宿",sub:"終點站 · 解鎖最後的禮物",time:""}
];
const GIFTS=[["手錶","⌚"],["捲捲捲髮棒","🪄"],["磁吸無線充電","🔋"],["精華梳子","🪮"],["CD 照片","💿"]];
// ==============================
let S={done:0,photos:[],draws:{}};
try{const r=localStorage.getItem("ylTrip");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("ylTrip",JSON.stringify(S))}catch(e){toast("手機儲存空間不足，照片可能無法保留")}}
const $=s=>document.querySelector(s),app=$("#app");
let cur=null,picked=null,videoBlob=null,videoExt="mp4";
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;app.appendChild(d);setTimeout(()=>d.remove(),2200)}
function fab(){return `<button class="fab" id="fab"><b>📷</b>記錄<em>${S.photos.length}</em></button>`}
function go(v,a){cur=v;picked=null;
 if(v==="cover"){app.innerHTML=`<div class="scr cover"><h1>我們的<br>雲林小旅行</h1><p>5 站 · 5 個驚喜<br>一整天的回憶</p><button class="btn w" onclick="go('tips')">開始冒險 ›</button></div>`;return}
 if(v==="tips"){app.innerHTML=`<div class="scr"><h2>🎁 先跟你說</h2><div class="stop" style="cursor:default;display:block;line-height:1.9;padding:18px">這是一個闖關領生日禮物的小程式，因為怕你覺得第一天太無聊，所以增加一點小互動，也當作是給你的驚喜，希望你會玩得開心，也希望你喜歡這個小遊戲</div><div class="tag">📖 出發前請先看</div><div class="stop" style="cursor:default"><div class="ic">👀</div><div>1. 記得觀察每一個地方，每一段話都要認真看，看完才可以按下任何的按鈕。</div></div><div class="stop" style="cursor:default"><div class="ic">📷</div><div>2. 右下角有一個相機圖案，可以隨時拍照記錄，當然也可以下載。</div></div><br><button class="btn" onclick="go('home')">我知道了，出發 ›</button></div>`;return}
 if(v==="gallery"){const P=pics(),n=P.length;app.innerHTML=`<div class="scr"><button class="back" onclick="go('home')">‹</button><h2>🖼 照片集（${n}）</h2>${n?`<p class="note">點照片可以放大並儲存</p><div class="grid">${P.map((p,i)=>`<img src="${p}" onclick="viewPhoto(${i})">`).join("")}</div>`:`<p class="note">還沒有照片，用右下角的 📷 拍一張吧！</p>`}</div>`+fab();bind();return}
 if(v==="home"){app.innerHTML=`<div class="scr"><h2>一起收集<br>今天的所有美好 ♡</h2>`+STATIONS.map((s,i)=>{
  const st=i<S.done?["已解鎖","ok"]:i===S.done?["進行中","go"]:["未解鎖",""];
  return `<div class="stop ${i>S.done?"lock":""}" onclick="openSt(${i})"><div class="ic">${s.icon}</div><div><b>${s.n}. ${s.name}</b><small>${s.time||s.sub}</small></div><div class="st ${st[1]}">${st[0]}</div></div>`}).join("")+`<p class="note">🎁 已抽中 ${Object.keys(S.draws).length} 份禮物</p><button class="btn p" onclick="go('gallery')">🖼 照片集（${S.photos.length}）</button></div>`+fab();bind();return}
 const s=STATIONS[a],head=`<button class="back" onclick="go('home')">‹</button><span class="badge">第 ${s.n} 站</span><h2>${s.name}</h2><div class="tag">${s.sub}</div>`;
 if(a===0){const p=S.start;app.innerHTML=`<div class="scr">${head}<p>早安打卡！<br>可以放一張你們出發時的合照，作為今天回憶的開端。</p><div class="polaroid">${p?`<img src="${p}">`:`<img alt="">`}<div style="margin-top:10px">出發！♡</div></div><button class="btn p" id="upbtn">${p?"📷 重新上傳合照":"📷 上傳合照"}</button><div id="boxarea"></div></div>`+fab();$("#upbtn").onclick=()=>$("#up").click();bind();if(p)showBoxes(0);return}
 if(a===4){const all=GIFTS.map((g,i)=>`<div class="gift ${Object.values(S.draws).includes(i)?"got":""}"><div>${g[1]}</div>${g[0]}</div>`).join("");
  if(S.draws[4]===undefined){app.innerHTML=`<div class="scr">${head}<p>抵達終點！<br>最後一個禮物，等你來抽 🎁</p><div id="boxarea"></div></div>`+fab();showBoxes(4);bind();return}
  app.innerHTML=`<div class="scr">${head}<p>解鎖最後的禮物，並啟動整天的「照片回顧跑馬燈」，播放今天隨手拍下的所有精彩瞬間！</p><h2 style="font-size:16px">— 最終禮物 —</h2><div class="gifts">${all}</div><p class="note">金框 = 你們一路抽中的禮物</p><div id="vbox"><button class="btn p" id="mk">▶ 開啟回憶影片</button></div><button class="btn" style="margin-top:10px" onclick="envelope()">💌 再看一次給你的信</button><button class="btn p" style="margin-top:10px" onclick="go('gallery')">🖼 照片集</button></div>`+fab();$("#mk").onclick=makeVideo;bind();return}
 if(S.draws[a]!==undefined){app.innerHTML=`<div class="scr">${head}<div id="boxarea"></div></div>`+fab();showBoxes(a);bind();return}
 app.innerHTML=`<div class="scr">${head}<div id="qa"></div></div>`+fab();bind();if(s.puzzle)puzzle(a);else if(s.draw)drawing(a);else ask(a,0)}
function ask(a,qi){const s=STATIONS[a],q=s.qs[qi];picked=null;
 $("#qa").innerHTML=`<p class="note">第 ${qi+1} / ${s.qs.length} 題 · 全部答對才能抽盲盒</p><p style="font-size:18px;font-weight:600">${q.q}</p><div id="opts">${q.opts.map((o,i)=>`<div class="opt" data-i="${i}"><i></i>${"ABCD"[i]}. ${o}</div>`).join("")}</div><button class="btn" id="ok">確認答案</button><div id="boxarea"></div>`;
 document.querySelectorAll(".opt").forEach(e=>e.onclick=()=>{document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel","bad"));e.classList.add("sel");picked=+e.dataset.i});
 $("#ok").onclick=()=>{if(picked===null)return toast("請先選一個答案");
  if(picked!==q.ans){document.querySelector(".opt.sel").classList.add("bad");return toast("再想想看喔～")}
  if(qi+1<s.qs.length){toast("答對了！下一題 💕");ask(a,qi+1)}else showBoxes(a)}}
const BOXC=[["#f4a6b8","#e0708f"],["#a8d5c2","#5fae92"],["#f6d38a","#e0a73c"],["#b9b0e8","#7f72c9"],["#a9cdf0","#5f93cf"]];
function boxSvg(c){return `<svg viewBox="0 0 100 100"><rect x="18" y="48" width="64" height="40" rx="5" fill="${c[0]}"/><rect x="45" y="48" width="10" height="40" fill="#fff8e6"/><rect x="18" y="80" width="64" height="8" rx="4" fill="#0000001a"/><g class="lid"><rect x="12" y="32" width="76" height="18" rx="5" fill="${c[1]}"/><rect x="45" y="32" width="10" height="18" fill="#fff8e6"/><path d="M50 32C38 14 22 22 33 32ZM50 32C62 14 78 22 67 32Z" fill="#fff8e6"/><circle cx="50" cy="31" r="4" fill="#ffe9b0"/></g></svg>`}
function confetti(){const f=document.createElement("div");f.className="fx";const cs=["#ff8fa3","#ffd166","#8fd3c1","#a99be8","#7fb5f0","#fff"];
 for(let i=0;i<46;i++){const e=document.createElement("i"),ang=Math.random()*Math.PI*2,r=90+Math.random()*190;e.style.cssText=`background:${cs[i%6]};--x:${Math.cos(ang)*r}px;--y:${Math.sin(ang)*r+90}px;--r:${Math.random()*720-360}deg;animation-delay:${Math.random()*.15}s`;f.appendChild(e)}
 app.appendChild(f);setTimeout(()=>f.remove(),1900)}
function prize(g,a,cb){const o=document.createElement("div");o.className="ov pz";
 o.innerHTML=`<div class="rays"></div><div class="pc"><small>${a===0?"🎂 生日特別禮物":"✨ 恭喜抽中 ✨"}</small><div class="pi">${GIFTS[g][1]}</div><h3>${GIFTS[g][0]}</h3><button class="btn" id="pk">收下禮物 ♡</button></div>`;
 app.appendChild(o);confetti();$("#pk").onclick=()=>{o.remove();cb()}}
function showBoxes(a){const d=S.draws[a],ok=$("#ok"),op=$("#opts");if(ok)ok.style.display="none";if(op)op.style.pointerEvents="none";
 const head=a===0?`<div class="tag">🎂 生日特別禮物<br><small>今天是你生日，所以第一關就直接讓你抽一個禮物吧！</small></div>`:a===4?`<div class="tag">🎁 終點站最後禮物</div>`:`<h2 style="font-size:17px">太棒了！抽一個盲盒 🎉</h2>`;
 $("#boxarea").innerHTML=head+`<p class="note">選一個盒子，打開看看是什麼 ✨</p><div class="boxes">${BOXC.map((c,i)=>`<div class="box" data-i="${i}" style="animation-delay:${i*.3}s">${boxSvg(c)}<span class="gi"></span></div>`).join("")}</div><div id="res"></div>`;
 const done=(el,g)=>{el.classList.add("open");el.querySelector(".gi").textContent=GIFTS[g][1];
  $("#res").innerHTML=`<div class="tag">${a===0?"🎂 生日禮物 · ":""}抽中：${GIFTS[g][0]}！</div>`+(a===4?`<button class="btn p" onclick="go('st',4)">繼續 ›</button>`:`<button class="btn" onclick="go('home')">回到行程</button>`);
  document.querySelectorAll(".box:not(.open)").forEach(b=>b.classList.add("dim"))};
 if(d!==undefined){done(document.querySelector(".box"),d);return}
 let busy=false;
 document.querySelectorAll(".box").forEach(b=>b.onclick=()=>{if(busy)return;busy=true;
  const left=GIFTS.map((_,i)=>i).filter(i=>!Object.values(S.draws).includes(i)),g=left[Math.floor(Math.random()*left.length)];
  S.draws[a]=g;if(S.done<a+1)S.done=a+1;save();
  document.querySelectorAll(".box").forEach(x=>{if(x!==b)x.classList.add("dim")});b.classList.add("shake");

function puzzle(a){const C=5,R=4,n=C*R;let ord=[...Array(n).keys()],sel=null,solved=false;
 do{for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ord[i],ord[j]]=[ord[j],ord[i]]}}while(ord.every((v,i)=>v===i));
 $("#qa").innerHTML=`<p>把照片拼回來吧！<br>點一塊，再點另一塊，兩塊會交換位置 🧩</p><div class="pzw" id="pzw" style="--img:url(${PUZ})"><div class="pzl" id="pzb"></div><div class="ref"></div></div><p class="note" id="pm">還沒完成，加油！</p><button class="btn p" id="pv">👀 偷看原圖（再按一次收起）</button><div id="boxarea"></div>`;
 const bd=$("#pzb");
 function draw(){bd.innerHTML=ord.map((v,i)=>`<div class="pp${sel===i?" on":""}" data-i="${i}" style="background-position:${(v%C)/(C-1)*100}% ${Math.floor(v/C)/(R-1)*100}%"></div>`).join("")}
 draw();
 $("#pv").onclick=()=>$("#pzw").classList.toggle("peek");
 bd.onclick=e=>{const t=e.target.closest(".pp");if(!t||solved)return;const i=+t.dataset.i;
  if(sel===null)sel=i;else if(sel===i)sel=null;else{[ord[sel],ord[i]]=[ord[i],ord[sel]];sel=null}
  draw();
  if(ord.every((v,k)=>v===k)){solved=true;bd.classList.add("done");$("#pzw").classList.remove("peek");$("#pv").style.display="none";$("#pm").textContent="🎉 拼好了！";confetti();setTimeout(()=>showBoxes(a),1100)}}}
const pics=()=>S.photos.concat(S.art?[S.art]:[]);
function drawing(a){const W=720,H=900,cols=["#4a3a2c","#e0708f","#e0a73c","#5fae92","#5f93cf","#7f72c9"];let col=cols[0],sz=6,er=false,strokes=0,down=false,lx=0,ly=0;const undo=[];
 $("#qa").innerHTML=`<div class="tag">✏️ 題目：在瑞士的我們 🇨🇭</div><p class="note">畫下你想像中的模樣吧！畫完就能抽禮物！</p><canvas id="cv" class="cv" width="${W}" height="${H}"></canvas><div class="tools" id="sw">${cols.map((c,i)=>`<b class="sw${i?"":" on"}" data-c="${c}" style="background:${c}"></b>`).join("")}</div><div class="tools" id="tb"><button class="tb on" data-k="s">細</button><button class="tb" data-k="l">粗</button><button class="tb" data-k="e">🧽 橡皮擦</button><button class="tb" data-k="u">↩ 復原</button><button class="tb" data-k="c">🗑 清空</button></div><button class="btn" id="dn">✅ 畫好了</button><div id="boxarea"></div>`;
 const cv=$("#cv"),g=cv.getContext("2d");g.lineCap="round";g.lineJoin="round";g.fillStyle="#fff";g.fillRect(0,0,W,H);
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
 const pen=()=>{g.strokeStyle=er?"#fff":col;g.lineWidth=er?sz*3:sz};
 const snap=()=>{undo.push(g.getImageData(0,0,W,H));if(undo.length>10)undo.shift()};
 cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);snap();down=true;[lx,ly]=pt(e);pen();g.beginPath();g.moveTo(lx,ly);g.lineTo(lx+.1,ly);g.stroke()};
 cv.onpointermove=e=>{if(!down)return;const[x,y]=pt(e);pen();g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y};
 const up=()=>{if(down){down=false;strokes++}};cv.onpointerup=up;cv.onpointercancel=up;
 $("#sw").onclick=e=>{const c=e.target.dataset.c;if(!c)return;col=c;er=false;document.querySelectorAll(".sw,.tb[data-k=e]").forEach(x=>x.classList.remove("on"));e.target.classList.add("on")};
 $("#tb").onclick=e=>{const k=e.target.dataset.k;if(!k)return;
  if(k==="s"||k==="l"){sz=k==="s"?6:16;document.querySelectorAll(".tb[data-k=s],.tb[data-k=l]").forEach(x=>x.classList.remove("on"));e.target.classList.add("on")}
  else if(k==="e"){er=!er;e.target.classList.toggle("on",er)}
  else if(k==="u"){const d=undo.pop();if(d)g.putImageData(d,0,0)}
  else if(k==="c"){snap();g.fillStyle="#fff";g.fillRect(0,0,W,H)}};
 $("#dn").onclick=()=>{if(!strokes)return toast("先畫點什麼吧！");
  S.art=cv.toDataURL("image/jpeg",.82);save();cv.style.pointerEvents="none";$("#sw").style.display=$("#tb").style.display=$("#dn").style.display="none";
  toast("🎨 已存進照片集和回憶影片");confetti();setTimeout(()=>showBoxes(a),900)}}
function openSt(i){if(i>S.done)return toast("🔒 請先完成上一站");go("st",i)}
function bind(){const f=$("#fab");if(f)f.onclick=()=>$("#cam").click()}
function shrink(file,max=800){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.src=r.result};r.readAsDataURL(file)})}
$("#cam").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;S.photos.push(await shrink(f));save();toast("✓ 已記錄第 "+S.photos.length+" 張");if(cur==="gallery")go("gallery");else refreshFab()};
function refreshFab(){const em=document.querySelector(".fab em");if(em)em.textContent=S.photos.length}
$("#up").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const d=await shrink(f);S.start=d;S.photos.unshift(d);if(S.done<1)S.done=1;save();go("st",0)};
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src});
async function makeVideo(){
 if(!window.MediaRecorder)return toast("此瀏覽器不支援影片合成");
 if(!S.photos.length)return toast("還沒有照片，先用右下角按鈕記錄吧！");
 const box=$("#vbox");box.innerHTML=`<p class="note">影片合成中，請稍候…</p><div class="bar"><div id="pg"></div></div>`;
 const imgs=await Promise.all(pics().map(load)),W=540,H=960,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
 const mt=["video/mp4","video/webm;codecs=vp9","video/webm"].find(t=>MediaRecorder.isTypeSupported(t))||"";
 videoExt=mt.includes("mp4")?"mp4":"webm";
 const rec=new MediaRecorder(c.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:3e6}:{}),ch=[];
 rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 const T=2.8,INTRO=2.6,END=5.5,total=INTRO+imgs.length*T+END,N=imgs.length;
 const bgs=imgs.map(im=>{const s=document.createElement("canvas");s.width=27;s.height=48;const g=s.getContext("2d"),k=Math.max(27/im.width,48/im.height);g.drawImage(im,(27-im.width*k)/2,(48-im.height*k)/2,im.width*k,im.height*k);return s});
 const vg=x.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.78);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.5)");
 const hearts=Array.from({length:16},(_,i)=>({x:30+(i*97)%480,s:38+(i*13)%40,o:(i*131)%1000,z:18+(i*7)%22}));
 function blurBg(i,a){x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.globalAlpha=a;x.drawImage(bgs[i],0,0,W,H);x.globalAlpha=a*.4;x.fillStyle="#000";x.fillRect(0,0,W,H);x.globalAlpha=1}
 function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()}
 function txt(t,y,sz,a,wt){x.globalAlpha=Math.max(0,Math.min(1,a));x.fillStyle="#fff7ea";x.font=`${wt||300} ${sz}px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;x.textAlign="center";t.split("\n").forEach((l,i)=>x.fillText(l,W/2,y+i*sz*1.7));x.globalAlpha=1}
 function introF(t){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#2b1d2e");g.addColorStop(.6,"#b9654a");g.addColorStop(1,"#f2b277");x.fillStyle=g;x.fillRect(0,0,W,H);
  const a=Math.min(1,t/.9)*Math.min(1,(INTRO-t)/.5);txt("我們的\n雲林小旅行",H/2-50,50,a,400);txt("ONE DAY  ·  FIVE STOPS",H/2+110,15,a*.7)}
 function photo(i,u,a){blurBg(i,a);const im=imgs[i],k=Math.min(468/im.width,640/im.height),z=1+.05*u,w=im.width*k*z,h=im.height*k*z,px=(W-w)/2,py=(H-h)/2-30;
  x.save();x.globalAlpha=a;x.shadowColor="#000a";x.shadowBlur=40;x.shadowOffsetY=14;rr(px,py,w,h,18);x.fillStyle="#000";x.fill();x.shadowBlur=0;x.clip();x.drawImage(im,px,py,w,h);x.restore();
  txt(String(i+1).padStart(2,"0")+"  /  "+String(N).padStart(2,"0"),H-112,20,a*.8);txt(i===N-1&&S.art?"在瑞士的我們":"雲林小旅行",H-76,15,a*.5)}
 function ending(et){blurBg(N-1,Math.min(1,et/.8));x.fillStyle="rgba(60,20,30,.35)";x.fillRect(0,0,W,H);
  x.font="28px sans-serif";x.textAlign="center";hearts.forEach(h=>{const y=H+40-((et*h.s+h.o)%(H+80));x.globalAlpha=.35*Math.min(1,et/1.5);x.fillStyle="#ffd6dc";x.font=h.z+"px sans-serif";x.fillText("♡",h.x+Math.sin(et*1.4+h.o)*14,y)});x.globalAlpha=1;
  txt("生日快樂 寶貝",H/2-70,54,et/1.2,500);
  x.globalAlpha=Math.min(1,Math.max(0,(et-1.2)/.8))*.6;x.fillStyle="#fff7ea";x.fillRect(W/2-24,H/2-28,48,1.5);x.globalAlpha=1;
  txt("希望每年生日\n我們都可以這樣陪著對方",H/2+20,24,(et-1.5)/1);txt("♡",H/2+150,30,(et-2.8)/1)}
 const t0=performance.now();rec.start();
 await new Promise(done=>{(function f(){const t=(performance.now()-t0)/1000;x.fillStyle="#1d1612";x.fillRect(0,0,W,H);
  if(t<INTRO)introF(t);
  else if(t<total-END){const u=t-INTRO,i=Math.min(N-1,Math.floor(u/T)),l=u-i*T;photo(i,l/T,Math.min(1,l/.55,(T-l)/.55))}
  else ending(t-(total-END));
  x.fillStyle=vg;x.fillRect(0,0,W,H);
  $("#pg").style.width=Math.min(100,t/total*100)+"%";
  if(t<total)requestAnimationFrame(f);else done()})()});
 await new Promise(r=>{rec.onstop=r;rec.stop()});
 videoBlob=new Blob(ch,{type:mt||"video/webm"});
 box.innerHTML=`<video id="vid" controls playsinline autoplay src="${URL.createObjectURL(videoBlob)}"></video><br><br><button class="btn p" id="dl">⬇ 下載影片</button><button class="btn" style="margin-top:10px" onclick="makeVideo()">🔄 重新合成（含新照片）</button>`;
 $("#dl").onclick=async()=>{try{const d=await claude.use("downloads");if(!d)return toast("此環境無法下載，請長按影片另存");await d.save({filename:"雲林小旅行回憶."+videoExt,data:videoBlob})}catch(e){if(e&&e.code!=="declined")toast("下載失敗，請長按影片另存")}}}
function dataBlob(u){const b=atob(u.split(",")[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:"image/jpeg"})}
function viewPhoto(i){const o=document.createElement("div");o.className="ov";o.style.flexDirection="column";o.style.gap="12px";
 o.innerHTML=`<img src="${pics()[i]}" style="max-width:100%;max-height:70%;border-radius:10px;object-fit:contain"><button class="btn p" id="ps">⬇ 儲存這張照片</button><button class="btn" id="pc">關閉</button>`;app.appendChild(o);
 $("#pc").onclick=()=>o.remove();
 $("#ps").onclick=async()=>{try{const d=await claude.use("downloads");if(!d)return toast("此環境無法儲存，請長按照片另存");await d.save({filename:"雲林小旅行-"+(i+1)+".jpg",data:dataBlob(pics()[i])})}catch(e){if(e&&e.code!=="declined")toast("儲存失敗，請長按照片另存")}}}
const LETTER=["最後，祝你生日快樂，我的小寶貝。", "這個小遊戲花了我好多時間和心思去製作，做到好累，雖然最後的成果可能沒有想像中那麼完美，但我還是很希望這個小小的網站能成為我們回憶裡特別的一部分，讓我們有多一點不一樣的互動，也多留下一些屬於我們特別的回憶。", "這個相機功能，其實是因為我希望我們可以多多拍照，把生活的部分記錄下來。也不知道最後結果怎麼樣，有沒有認真拍照，但也沒關係，因為我更在意的是，我們一起玩了這個遊戲，一起經歷了這些小小的事情，讓這趟旅程多了一點特別的意義。", "這是我陪你度過的第三個生日對吧？時間真的過得好快。希望以後的每一年，我都還有機會陪在你身邊，陪你過生日、陪你去好多地方，一起去瑞士。", "還記得你之前跟我說你對生日沒什麼感覺，不會想要特別去過，沒有過也沒關係，但是因為我很喜歡生日，所以你也開始會重視，會陪我一起度過這個不一樣的日子，不知道你會不會因為我，而喜歡上過生日，開始會期待生日？對我來說生日是很特別的，我好希望每一次的生日都有你，不管是我的生日還是你的生日。", "不知道你看到這裡會不會有一點點感動", "接下來的兩天也要開開心心地玩，好好享受這趟旅程，也希望你能感受到，我真的很想讓你擁有一個特別的生日。", "最後的最後，再說一次，生日快樂，我的小寶貝。", "希望未來還有好多個生日，我們都能一起度過。", "愛你，很愛你。 ♡"];
function envelope(){if(document.querySelector(".ov"))return;const o=document.createElement("div");o.className="ov";
 o.innerHTML=`<div class="env" id="env"><div class="em">💌</div>有一封信給你<br><small>點一下打開</small></div>`;app.appendChild(o);
 $("#env").onclick=()=>{o.innerHTML=`<div class="letter"><div class="lt">${LETTER.map(t=>`<p>${t}</p>`).join("")}</div><button class="btn p" id="lx">收下這封信 ♡</button></div>`;$("#lx").onclick=()=>o.remove()}}
go("cover");
</script>
